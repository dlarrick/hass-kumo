set_temp_source:
  target:
    entity:
      integration: kumo
      domain: climate
  fields:
    source:
      required: true
      example: api
      selector:
        select:
          options:
            - api
            - returnair
            - remote
            - sensor0
            - sensor1
            - sensor2
            - sensor3
set_room_temperature:
  target:
    entity:
      integration: kumo
      domain: climate
  fields:
    temperature:
      required: true
      example: 20.5
      selector:
        number:
          min: -10
          max: 40
          step: 0.1
          mode: box
